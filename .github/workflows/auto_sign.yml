name: Auto-Sign & Health Check Locket Gold (ZSign)

on:
  schedule:
    # Tự động chạy mỗi 30 phút trên máy chủ GitHub (24/7 kể cả khi tắt PC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công ngay trên tab Actions

permissions:
  contents: write

concurrency:
  group: "auto-sign-main"
  cancel-in-progress: true

jobs:
  sync-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install prebuilt zsign v1.1.3
        run: |
          curl -sL https://github.com/zhlynn/zsign/releases/download/v1.1.3/zsign-linux-x86_64.tar.gz | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/zsign
          /usr/local/bin/zsign --version || true

      - name: Pull latest changes before signing
        run: |
          git pull --rebase origin main || true

      - name: Run Self-Hosted ZSign Locket Gold Signer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 sign_locket.py --force
          else
            python3 sign_locket.py
          fi

      - name: Commit and Push updated manifests, cache & HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A manifests/ certs/ links_cache*.json index.html config*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(zsign): update Locket Gold ZSign manifests & portal links [skip ci]"
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main
          else
            echo "Không có thay đổi mới cần commit."
          fi
